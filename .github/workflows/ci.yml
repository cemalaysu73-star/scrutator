name: ci

on:
  push:
    branches: [main]
  pull_request:

# the tests never touch the network (every HTTP source is a respx fixture, every DNS lookup a fake resolver), so a job
# needs no secrets and only reads the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v

  bench:
    # OSINT-Bench v0 is offline and deterministic: the job fails when any threshold fails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: scrutator bench --out bench-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            bench-out/bench.json
            bench-out/bench.md

  wheel:
    # build a wheel, install it into a fresh virtual environment outside the checkout and run the installed
    # program: package data (knowledge packs, report template), the console script, the MCP server and bundles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
      - name: Install it into a fresh virtual environment, with the MCP extra
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          if [ -d "$RUNNER_TEMP/fresh/Scripts" ]; then BIN="$RUNNER_TEMP/fresh/Scripts"; else BIN="$RUNNER_TEMP/fresh/bin"; fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install "$(ls "$RUNNER_TEMP"/wheel/scrutator-*.whl)[mcp]"
      - name: Smoke test the installed program (never imports the checkout)
        run: |
          EXE="$BIN/scrutator"; [ -f "$BIN/scrutator.exe" ] && EXE="$BIN/scrutator.exe"
          cd "$RUNNER_TEMP" && "$BIN/python" -I "$GITHUB_WORKSPACE/tools/wheel_smoke.py" --scrutator "$EXE" --work "$RUNNER_TEMP/smoke"
      - name: SBOM of the installed environment (CycloneDX 1.5)
        run: cd "$RUNNER_TEMP" && "$BIN/python" -I "$GITHUB_WORKSPACE/tools/sbom.py" --extra mcp --out "$RUNNER_TEMP/sbom.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-and-sbom-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/wheel/*.whl
            ${{ runner.temp }}/sbom.cdx.json

  docs:
    # every `scrutator ...` command shown in the Markdown exists with those options, relative links and anchors
    # resolve, and the Mermaid diagrams parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python release/check_docs_commands.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t scrutator:ci .
      - run: docker run --rm scrutator:ci --version
      - run: docker run --rm scrutator:ci bench --out /tmp/bench
