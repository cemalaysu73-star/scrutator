[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrutator"
version = "1.0.0rc4"
description = "Evidence-backed, AI-driven infrastructure OSINT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["osint", "reconnaissance", "dns", "certificate-transparency", "attack-surface", "evidence", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "dnspython>=2.6",
  "pyyaml>=6.0",
  "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
socks = ["httpx[socks]>=0.27"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "hypothesis>=6.100",
  "mcp>=2.3,<3",
]

[project.scripts]
scrutator = "scrutator.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
