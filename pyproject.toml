[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrutator"
version = "0.1.0"
description = "Evidence-backed, AI-driven infrastructure OSINT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "dnspython>=2.6",
  "pyyaml>=6.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "hypothesis>=6.100",
]

[project.scripts]
scrutator = "scrutator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
