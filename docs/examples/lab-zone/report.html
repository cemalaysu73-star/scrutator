*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}

.muted{color:var(--muted)}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:110px}
.card b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
.badge{font-size:12px;font-weight:600;text-transform:uppercase}

details{margin:2px 0}
pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;max-height:240px;white-space:pre-wrap}
svg{width:100%;height:520px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg)}
select,input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:0 8px 8px 0}
ul.statements{padding-left:20px}
.remedy{margin-top:4px}
.headline{font-size:17px;font-weight:600;margin:8px 0}
.tier-group{margin:12px 0}
.tier-group>summary{cursor:pointer;font-weight:600;padding:6px 0}
.tier-note{margin:2px 0 8px}
td.sev{white-space:nowrap;word-break:normal;width:1%}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.band-confirmed{color:var(--high)}.band-probable{color:var(--medium)}.band-possible{color:var(--low)}.band-unlikely{color:var(--muted)}
ul.signals{margin:4px 0;padding-left:18px}
ul.statements li{margin:6px 0}
</style>

 "hackertarget": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 2, "skipped": 0}, "internetdb": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 17, "skipped": 0}, "mnemonic": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 2, "skipped": 0}, "rdap": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 19, "skipped": 0}, "ripestat": {"cancelled": 0, "denied": 0, "down": false, "error": 17, "errors": ["ModuleError: ripestat returned HTTP 404"], "ok": 0, "skipped": 0}, "subdomaincenter": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 2, "skipped": 0}, "urlscan": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 2, "skipped": 0}, "wayback": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 2, "skipped": 0}, "wildcard": {"cancelled": 0, "denied": 0, "down": false, "error": 0, "errors": [], "ok": 2, "skipped": 0}}, "summary": {"by_scope": {"in": 22, "linked": 17, "out": 16}, "by_type": {"asn": 1, "domain": 37, "ip": 17}, "candidates": 0, "edges": 73, "entities": 55, "findings": 73, "findings_by_tier": {"claimed": 0, "other": 17, "stale": 7, "verified": 49, "wildcard": 0}, "headline": "17 verified, 1 claimed (4 stale, 0 wildcard-covered)", "leads": 0, "names": {"live": 17, "stale": 5, "unresolved": 0, "wildcard": 0}, "risks": 23, "tiers": {"claimed": 1, "stale": 4, "verified": 17, "wildcard": 0}}, "summary_statements": [], "tool": {"name": "scrutator", "version": "0.7.0"}, "unverified_leads": []}</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const el = (tag, props = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) node[key] = value;
  for (const kid of kids) node.append(kid);
  return node;
};
const section = (hostId, title, node) => {
  document.getElementById(hostId).append(el("h2", {textContent: title}), node);
};

const aiLine = D.ai
  ? " · AI: " + Object.entries(D.ai.providers || {}).map(([role, p]) => `${role} ${p.provider}/${p.model} (${p.local ? "local" : "cloud"})`).join(", ")
  : " · AI: off";
document.getElementById("meta").textContent =
  `${D.scan.seed} · scan #${D.scan.id} · generated ${D.generated_at} · scrutator ${D.tool.version}${aiLine}`;

if (D.summary.headline) {
  document.getElementById("headline").append(el("p", {className: "headline", textContent: "Names: " + D.summary.headline + ". Verified names come first; the rest are counted below and open on demand."}));
}
const cards = document.getElementById("cards");
const counts = {
  "Entities": D.summary.entities,
  "In scope": D.summary.by_scope.in || 0,
  "Linked": D.summary.by_scope.linked || 0,
  "Candidates": D.summary.by_scope.candidate || 0,
  "Out of scope": D.summary.by_scope.out || 0,
  "Edges": D.summary.edges,
  "Findings": D.summary.findings,
};
const tierCounts = D.summary.tiers || {};
if (D.names && D.names.length) {
  counts["Verified names"] = tierCounts.verified || 0;
  counts["Claimed names"] = tierCounts.claimed || 0;
  counts["Stale names"] = tierCounts.stale || 0;
  counts["Wildcard-covered"] = tierCounts.wildcard || 0;
}
for (const [label, value] of Object.entries(counts)) {
  cards.append(el("div", {className: "card"}, el("b", {textContent: String(value)}), label));
}

function renderNarrative() {
  const statements = D.summary_statements || [];
  if (!statements.length) return;
  const list = el("ul", {className: "statements"});
  for (const s of statements) {
    const refs = el("details", {}, el("summary", {textContent: `${s.evidence_ids.length} evidence record(s)`}));
    for (const id of s.evidence_ids) {
      const ev = D.evidence[id];
      if (ev) refs.append(el("div", {className: "muted", textContent: `${ev.source}: ${ev.request}`}));
    }
    list.append(el("li", {}, el("span", {textContent: s.text + " "}), el("span", {className: `badge ${s.confidence}`, textContent: s.confidence}), refs));
  }
  section("extra", "AI summary (every statement checked against the cited evidence)", list);
}

function renderSources() {
  const rows = Object.entries(D.sources || {}).sort(([a], [b]) => a.localeCompare(b));
  if (!rows.length) return;
  const table = el("table", {}, el("tr", {}, ...["Source", "OK", "Failed", "Denied", "Skipped", "Cancelled", "Status", "Errors"].map(t => el("th", {textContent: t}))));
  let gaps = 0;
  for (const [name, h] of rows) {
    gaps += h.error + (h.cancelled || 0);
    table.append(el("tr", {},
      el("td", {textContent: name}),
      el("td", {textContent: String(h.ok)}),
      el("td", {className: h.error ? "bad" : "", textContent: String(h.error)}),
      el("td", {textContent: String(h.denied)}),
      el("td", {textContent: String(h.skipped)}),
      el("td", {className: h.cancelled ? "bad" : "", textContent: String(h.cancelled || 0)}),
      el("td", {className: h.down ? "bad" : "", textContent: h.down ? "down" : "answered"}),
      el("td", {textContent: h.errors.join("; ")})));
  }
  const cov = D.coverage || {};
  const down = cov.sources_down || [];
  const notes = [el("p", {className: "muted", textContent: gaps
    ? `${gaps} source run(s) failed or were cancelled. Coverage has gaps: a missing result may only mean a source did not answer.`
    : "Every source run answered."})];
  if (down.length) notes.push(el("p", {className: "bad", textContent: `Marked down after repeated failures, not asked again in this scan: ${down.join(", ")}.`}));
  if (cov.deadline_hit) notes.push(el("p", {className: "bad", textContent: `The scan hit its ${cov.deadline_s} s deadline: lookups still running were cancelled and the rest did not start. This report is partial.`}));
  section("extra", "Source coverage", el("div", {}, ...notes, table));
}

function renderAttribution() {
  const att = D.attribution;
  if (!att) return;
  const all = att.candidates || [];
  const promoted = new Set((D.promotions || []).map(p => p.entity));
  const host = el("div");
  const bands = att.bands || {};
  host.append(el("p", {className: "muted", textContent: all.length
    ? `Names outside the scope with evidence tying them to the organisation: ${bands.confirmed || 0} confirmed, ${bands.probable || 0} probable, ${bands.possible || 0} possible, ${bands.unlikely || 0} unlikely` + (att.omitted_unlikely ? ` (${att.omitted_unlikely} more unlikely not listed)` : "") + ". Scores are heuristic and each signal cites its evidence. A candidate is only looked at passively until you promote it with scrutator promote."
    : "No name outside the scope has evidence tying it to the organisation. That is not proof that none exists: a name no certificate, record or registration links to the scope cannot be found this way."}));
  if (all.length) {
    const filter = el("select", {}, ...[["", "possible or better"], ["all", "all bands"], ["confirmed", "confirmed"], ["probable", "probable"], ["possible", "possible"], ["unlikely", "unlikely"]].map(([value, label]) => el("option", {value, textContent: label})));
    const body = el("tbody");
    const wanted = (band) => filter.value === "all" || (filter.value === "" ? band !== "unlikely" : band === filter.value);
    const draw = () => {
      body.replaceChildren();
      for (const c of all) {
        if (!wanted(c.band)) continue;
        const signals = el("ul", {className: "signals"});
        for (const s of c.signals) {
          const item = el("li", {}, el("b", {textContent: `${s.kind} ${s.weight.toFixed(2)}`}), el("span", {textContent: " " + s.detail}));
          if (s.note) item.append(el("div", {className: "muted", textContent: s.note}));
          item.append(evidenceDetails(s.evidence_ids));
          signals.append(item);
        }
        const name = el("td", {}, el("b", {textContent: c.value}), el("span", {className: "tag", textContent: c.state}));
        if (promoted.has(c.entity_id)) name.append(el("span", {className: "tag", textContent: "promoted"}));
        name.append(el("div", {className: "muted", textContent: c.explanation}));
        const doubts = el("td");
        if (!c.premortem.length) doubts.append(el("span", {className: "muted", textContent: "none found by the rules"}));
        for (const note of c.premortem) doubts.append(el("div", {}, el("span", {textContent: note.text}), evidenceDetails(note.evidence_ids)));
        body.append(el("tr", {},
          name,
          el("td", {className: "sev"}, el("span", {className: `badge band-${c.band}`, textContent: c.band}), el("div", {className: "muted", textContent: `score ${c.score.toFixed(2)}`})),
          el("td", {}, signals),
          doubts));
      }
    };
    filter.addEventListener("input", draw);
    host.append(filter, el("table", {}, el("thead", {}, el("tr", {}, ...["Name", "Band", "Why it may be ours", "What could make it wrong"].map(t => el("th", {textContent: t})))), body));
    draw();
  }
  section("attribution", "Attribution (candidates for the scope)", host);
}

function renderAnalystLeads() {
  const verified = (D.leads || {}).verified || [];
  if (!verified.length) return;
  const list = el("ul", {className: "statements"});
  for (const lead of verified) {
    const item = el("li", {}, el("span", {className: "tag", textContent: lead.kind === "premortem" ? "pre-mortem" : "lead"}), el("span", {textContent: " " + lead.claim}));
    if (lead.check) item.append(el("div", {className: "muted", textContent: "Suggested check (not run): " + lead.check}));
    item.append(evidenceDetails(lead.evidence_ids));
    list.append(item);
  }
  section("attribution", "Analyst leads (written by the AI, each checked against the evidence it cites)", list);
}

function renderLeads() {
  const rejected = ((D.leads || {}).rejected || []).map(l => ({text: l.claim, reason: l.reason}));
  const leads = [...(D.unverified_leads || []), ...rejected];
  if (!leads.length) return;
  const list = el("ul", {className: "statements"});
  for (const l of leads) list.append(el("li", {}, el("span", {textContent: l.text + " "}), el("span", {className: "muted", textContent: `(rejected: ${l.reason})`})));
  section("extra-after", "Unverified leads (not part of the report)", list);
}

function evidenceDetails(ids) {
  const cell = el("div");
  for (const id of ids) {
    const ev = D.evidence[id];
    if (!ev) continue;
    cell.append(el("details", {},
      el("summary", {textContent: `${ev.source}: ${ev.request}`}),
      el("div", {className: "muted", textContent: `collected ${ev.collected_at} · id ${id}`}),
      el("pre", {textContent: ev.payload.slice(0, 20000)})));
  }
  return cell;
}

function renderRisks() {
  const risks = D.risks || [];
  const host = el("div");
  const counts = {high: 0, medium: 0, low: 0, info: 0};
  for (const r of risks) counts[r.severity] = (counts[r.severity] || 0) + 1;
  host.append(el("p", {className: "muted", textContent: risks.length
    ? `${risks.length} risk(s): ${counts.high} high, ${counts.medium} medium, ${counts.low} low, ${counts.info} info. Each one cites the evidence it rests on; the analyst category marks oddities a reviewer could miss.`
    : "No risks were derived from the evidence this scan collected. That is not a clean bill of health: a source that failed or a lookup that did not run produces no finding."}));
  if (risks.length) {
    const filter = el("select", {}, el("option", {value: "", textContent: "all categories"}), el("option", {value: "risk", textContent: "risk"}), el("option", {value: "analyst", textContent: "analyst"}));
    const body = el("tbody");
    const draw = () => {
      body.replaceChildren();
      for (const r of risks) {
        if (filter.value && r.category !== filter.value) continue;
        const what = el("td", {}, el("b", {textContent: r.title}), el("span", {className: "tag", textContent: r.rule_id}));
        if (r.category === "analyst") what.append(el("span", {className: "tag", textContent: "analyst"}));
        what.append(el("div", {textContent: r.explanation}), el("div", {className: "muted remedy", textContent: "Remediation: " + r.remediation}));
        what.append(el("div", {className: "muted", textContent: "Entities: " + r.entity_ids.join(", ")}));
        body.append(el("tr", {},
          el("td", {className: "sev"}, el("span", {className: `badge sev-${r.severity}`, textContent: r.severity}), el("div", {className: "muted", textContent: `confidence ${r.confidence}`})),
          what,
          el("td", {}, evidenceDetails(r.evidence_ids))));
      }
    };
    filter.addEventListener("input", draw);
    host.append(filter, el("table", {}, el("thead", {}, el("tr", {}, ...["Severity", "Risk", "Evidence"].map(t => el("th", {textContent: t})))), body));
    draw();
  }
  section("risks", "Risks", host);
}

function renderDependencies() {
  const deps = D.dependencies || [];
  if (!deps.length) return;
  const table = el("table", {}, el("thead", {}, el("tr", {}, ...["Role", "Provider", "Seen through", "Names", "Evidence"].map(t => el("th", {textContent: t})))));
  const body = el("tbody");
  for (const d of deps) {
    const names = el("details", {}, el("summary", {textContent: `${d.hostnames.length} name(s)`}), el("div", {className: "muted", textContent: d.hostnames.join(", ")}));
    const provider = el("td", {textContent: d.provider});
    if (!d.verified) provider.append(el("span", {className: "tag", textContent: "pattern not yet verified"}));
    body.append(el("tr", {}, el("td", {textContent: d.category}), provider, el("td", {textContent: d.via.join(", ")}), el("td", {}, names), el("td", {}, evidenceDetails(d.evidence_ids))));
  }
  table.append(body);
  section("risks", "Provider dependencies", el("div", {}, el("p", {className: "muted", textContent: "Which third parties stand behind the in-scope names, recognised from the knowledge packs."}), table));
}

const NAME_STATE = {};
for (const row of D.names || []) NAME_STATE[row.name] = row.state;
const STATE_LABEL = {live: "live", stale: "stale (NXDOMAIN)", wildcard: "wildcard-covered", unresolved: "unresolved"};
const TIER_LABEL = {verified: "Verified", other: "Addresses and registrations", claimed: "Claimed", stale: "Stale", wildcard: "Wildcard-covered"};
const TIER_NOTE = {
  verified: "DNS resolves them, or a certificate or a scan dated inside the last 90 days names them and DNS does not contradict it.",
  other: "Relations that are about an address, a network or a registration rather than about one name.",
  claimed: "Only a list (an aggregator, an archive) names them, and DNS gives no sign of them. Kept as claims, with the reason.",
  stale: "Evidenced once (a certificate or a scan), but DNS no longer agrees or the record is older than 90 days.",
  wildcard: "Only the zone's wildcard record answers for them, so DNS does not prove they exist.",
};
const nameTier = (r) => r.tier || (r.state === "live" ? "verified" : r.state === "wildcard" ? "wildcard" : "claimed");

// Verified groups are shown; every other group is a counted disclosure whose table is built when it is first opened.
function tierGroups(items, tierOf, order, noun, makeTable) {
  const host = el("div");
  for (const tier of order) {
    const rows = items.filter(item => tierOf(item) === tier);
    if (!rows.length) continue;
    const note = el("p", {className: "muted tier-note", textContent: TIER_NOTE[tier] || ""});
    if (tier === "verified" || tier === "other") {
      host.append(el("h3", {textContent: `${TIER_LABEL[tier]} (${rows.length} ${noun})`}), note, makeTable(rows));
    } else {
      const group = el("details", {className: "tier-group"}, el("summary", {textContent: `${TIER_LABEL[tier]}: ${rows.length} ${noun} (click to expand)`}), note);
      let built = false;
      group.addEventListener("toggle", () => {
        if (group.open && !built) { built = true; group.append(makeTable(rows)); }
      });
      host.append(group);
    }
  }
  return host;
}

function renderNames() {
  const rows = D.names || [];
  if (!rows.length) return;
  const host = el("div");
  const c = D.summary.names || {};
  host.append(el("p", {className: "muted", textContent:
    `${rows.length} in-scope name(s) (the apex included). By tier: ${D.summary.headline || ""}. By DNS state: ${c.live || 0} live, ${c.stale || 0} stale (the address lookup returned NXDOMAIN), ${c.wildcard || 0} wildcard-covered, ${c.unresolved || 0} unresolved (no address recorded). A certificate or archive naming a host does not make it live.`}));
  const table = (items) => {
    const body = el("tbody");
    for (const r of items) {
      body.append(el("tr", {},
        el("td", {textContent: r.name}),
        el("td", {className: nameTier(r) === "verified" ? "" : "bad", textContent: (TIER_LABEL[nameTier(r)] || nameTier(r)) + (r.basis ? ` (${r.basis})` : "")}),
        el("td", {textContent: STATE_LABEL[r.state] || r.state}),
        el("td", {textContent: r.tier_reason || r.reason}),
        el("td", {textContent: r.named_by.join(", ")}),
        el("td", {}, evidenceDetails(r.evidence_ids))));
    }
    return el("table", {}, el("thead", {}, el("tr", {}, ...["Name", "Tier", "DNS state", "Why", "Named by", "Evidence"].map(t => el("th", {textContent: t})))), body);
  };
  host.append(tierGroups(rows, nameTier, ["verified", "claimed", "stale", "wildcard"], "name(s)", table));
  section("risks", "Name states (what the evidence says about each in-scope name)", host);
}

function renderExposure() {
  const rows = D.exposure || [];
  if (!rows.length) return;
  const table = el("table", {}, el("thead", {}, el("tr", {}, ...["Address", "Open ports (Shodan)", "Products", "CVEs listed", "Network", "Abuse contact", "Evidence"].map(t => el("th", {textContent: t})))));
  const body = el("tbody");
  for (const r of rows) {
    body.append(el("tr", {},
      el("td", {textContent: `${r.ip} (${r.state})`}),
      el("td", {textContent: r.ports.join(", ")}),
      el("td", {textContent: r.cpes.join(", ")}),
      el("td", {textContent: r.vulns.join(", ")}),
      el("td", {textContent: [r.netname, r.country, r.description].filter(Boolean).join(" · ")}),
      el("td", {textContent: r.abuse_contacts.join(", ")}),
      el("td", {}, evidenceDetails(r.evidence_ids))));
  }
  table.append(body);
  section("risks", "Exposure of the addresses (Shodan InternetDB and RIPEstat)", el("div", {}, el("p", {className: "muted", textContent: "What Shodan saw open on the addresses the in-scope names resolve to, an earlier scan by Shodan and not a check made now; CVE ids are Shodan's guesses from product versions. Abuse contact and network name are from RIPEstat. Non-commercial data: see the README."}), table));
}

function renderFindings() {
  const host = document.getElementById("findings");
  const by = D.summary.findings_by_tier;
  if (by) {
    host.append(el("p", {className: "muted", textContent:
      `${D.summary.findings} finding(s), one per relation: ${by.verified} about verified names, ${by.other} about addresses and registrations, ${by.claimed} about claimed names, ${by.stale} about stale names, ${by.wildcard} about wildcard-covered names. All are kept; the last three groups open on demand.`}));
  }
  const table = (items) => {
    const t = el("table", {}, el("tr", {}, el("th", {textContent: "Claim"}), el("th", {textContent: "Confidence"}), el("th", {textContent: "Evidence"})));
    for (const f of items) {
      const evidenceCell = el("td");
      for (const id of f.evidence_ids) {
        const ev = D.evidence[id];
        evidenceCell.append(el("details", {},
          el("summary", {textContent: `${ev.source}: ${ev.request}`}),
          el("div", {className: "muted", textContent: `collected ${ev.collected_at} · id ${id}`}),
          el("pre", {textContent: ev.payload.slice(0, 20000)})));
      }
      const claim = el("td", {textContent: f.claim});
      for (const id of f.entity_ids) {
        const state = NAME_STATE[id.replace(/^domain:/, "")];
        if (state && state !== "live") claim.append(el("span", {className: "tag bad", textContent: STATE_LABEL[state]}));
      }
      t.append(el("tr", {},
        claim,
        el("td", {}, el("span", {className: `badge ${f.confidence}`, textContent: f.confidence})),
        evidenceCell));
    }
    return t;
  };
  host.append(tierGroups(D.findings, f => f.tier || "verified", ["verified", "other", "claimed", "stale", "wildcard"], "finding(s)", table));
}

function renderEntities() {
  const host = document.getElementById("entities");
  const typeSelect = el("select", {}, el("option", {value: "", textContent: "all types"}));
  for (const t of Object.keys(D.summary.by_type)) typeSelect.append(el("option", {value: t, textContent: t}));
  const scopeSelect = el("select", {}, el("option", {value: "", textContent: "all scopes"}));
  for (const s of ["in", "candidate", "linked", "out"]) scopeSelect.append(el("option", {value: s, textContent: s}));
  const search = el("input", {type: "search", placeholder: "filter"});
  const body = el("tbody");
  const draw = () => {
    body.replaceChildren();
    for (const e of D.entities) {
      if (typeSelect.value && e.type !== typeSelect.value) continue;
      if (scopeSelect.value && e.state !== scopeSelect.value) continue;
      if (search.value && !e.value.includes(search.value.toLowerCase())) continue;
      const resolution = e.type === "domain" && NAME_STATE[e.value] ? ` · ${STATE_LABEL[NAME_STATE[e.value]]}` : "";
      body.append(el("tr", {}, el("td", {textContent: e.value}), el("td", {textContent: e.type}), el("td", {textContent: e.state + resolution})));
    }
  };
  for (const control of [typeSelect, scopeSelect, search]) control.addEventListener("input", draw);
  host.append(typeSelect, scopeSelect, search,
    el("table", {}, el("thead", {}, el("tr", {}, el("th", {textContent: "Value"}), el("th", {textContent: "Type"}), el("th", {textContent: "Scope"}))), body));
  draw();
}

function drawGraph() {
  const svg = document.getElementById("graph");
  const W = 1000, H = 520;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const rank = {in: 0, candidate: 1, linked: 2, out: 3};
  const ents = [...D.entities].sort((a, b) => rank[a.state] - rank[b.state]).slice(0, 300);
  const index = new Map(ents.map((e, i) => [e.id, i]));
  const nodes = ents.map((e, i) => ({
    e,
    x: W / 2 + Math.cos(i) * 200 * (1 + i / ents.length),
    y: H / 2 + Math.sin(i) * 150 * (1 + i / ents.length),
    vx: 0, vy: 0,
  }));
  const links = D.edges.filter(l => index.has(l.src) && index.has(l.dst)).map(l => [index.get(l.src), index.get(l.dst)]);
  for (let step = 0; step < 250; step++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        const d2 = Math.max(dx * dx + dy * dy, 25), d = Math.sqrt(d2), f = 900 / d2;
        dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    for (const [i, j] of links) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      a.vx += dx * 0.01; a.vy += dy * 0.01; b.vx -= dx * 0.01; b.vy -= dy * 0.01;
    }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.002; n.vy += (H / 2 - n.y) * 0.002;
      n.x = Math.min(W - 10, Math.max(10, n.x + n.vx));
      n.y = Math.min(H - 10, Math.max(10, n.y + n.vy));
      n.vx *= 0.6; n.vy *= 0.6;
    }
  }
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  };
  for (const [i, j] of links) {
    svg.append(mk("line", {x1: nodes[i].x, y1: nodes[i].y, x2: nodes[j].x, y2: nodes[j].y, stroke: "currentColor", "stroke-opacity": 0.25}));
  }
  const colors = {domain: "#2b5fd9", ip: "#047857", asn: "#b45309", org: "#7c3aed"};
  for (const n of nodes) {
    const circle = mk("circle", {
      cx: n.x, cy: n.y, r: n.e.state === "in" ? 6 : 4,
      fill: colors[n.e.type] || "#888", "fill-opacity": n.e.state === "out" ? 0.35 : 1,
    });
    const title = mk("title", {});
    title.textContent = `${n.e.type}: ${n.e.value} (${n.e.state})`;
    circle.append(title);
    svg.append(circle);
  }
}

renderNarrative();
renderSources();
renderRisks();
renderNames();
renderDependencies();
renderExposure();
renderAttribution();
renderAnalystLeads();
renderFindings();
renderEntities();
drawGraph();
renderLeads();
</script>
