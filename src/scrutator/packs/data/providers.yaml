# Provider fingerprints (spec section 13). One entry per provider and category.
#
# Matching: ns / mx / spf / cname are host suffixes on label boundaries (a label may contain *);
# asn is an AS number; issuer is a lower-case substring of a certificate issuer name.
# Every entry carries `examples` that it must match (tested), and a `source` to check it against.
# verified: true means the patterns were checked against that source on 2026-10-16;
# verified: false means they are widely known but not yet re-checked: please check one and send a PR.
schema: 1
kind: providers
version: 2026.10.1
updated: 2026-10-16
description: Name server, mail, CDN, hosting and certificate authority fingerprints.
