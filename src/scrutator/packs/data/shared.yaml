# Shared platforms: addresses that serve many customers. Active confirmation (scrutator audit --active) never connects to
# an address that one of these entries recognises: it is not the client's own server, and a connection check would be a
# connection to someone else's infrastructure. The skip and its reason are recorded as evidence.
#
# An address is recognised by (any of): its AS number (`asn`), a CIDR range it is in (`cidrs`), a host-name suffix
# (`hosts`: the CNAME target of an in-scope name, or a reverse name Shodan's InternetDB saw for the address), or a
# substring of the network name RIPEstat reports (`netname`).
#
# `verified: true` means the patterns were checked against the cited source on the date in the note. `verified: false`
# means they are widely published but not re-read: the entry is still in force (a wrong pattern costs a skipped probe,
# never a probe of the wrong host), and a maintainer is asked to check it. Add a platform you meet that is missing: an
# unlisted shared address is probed with a handful of connections, which is the gap this file exists to narrow.
#
# Dedicated hosting (Hetzner, OVH, DigitalOcean, an AWS or Azure virtual machine) is deliberately NOT listed: a virtual
# server is its customer's own machine.
schema: 1
kind: shared
version: 2026.11.1
updated: 2026-11-07
