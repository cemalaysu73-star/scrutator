schema: 1
kind: platforms
version: 2026.10.1
updated: 2026-10-20
description: >-
  Platforms an organisation may link to from its own site: how a profile URL is built and how the HTTP status of the
  public profile page shows whether a handle exists (no login, nothing read from the page).
# `verified: true` means the presence behaviour described in `note` was observed live on 2026-10-20 (source: the
# platform itself). The handle character and length rules are the platforms' published rules as known to the author and
# were not re-checked: a valid handle outside them is not recognised in a link.
entries:
  # --- status-checkable: behaviour observed on 2026-10-20 from one network in the Netherlands, two requests each
  #     (the platform's own account and a random handle that cannot exist); see .cemal/rounds/r5-opus.md
  - id: github
    platform: GitHub
    profile: "https://github.com/{handle}"
    link_hosts: [github.com, www.github.com]
    link_paths: ["/{handle}"]
    handle_chars: "-"
    handle_min: 1
    handle_max: 39
    no_edge: "-"
    reserved: [about, apps, collections, contact, customer-stories, enterprise, events, explore, features, join, login, marketplace, new, notifications, orgs, pricing, readme, security, settings, site, sponsors, team, topics, trending]
    presence: status
    exists: [200]
    absent: [404]
    examples: ["https://github.com/example", "https://www.github.com/example-org/"]
    source: "https://github.com/"
    verified: true
    note: "github.com/github answered 200 and a random handle 404 (2026-10-20). A suspended or renamed account also answers 404."
  - id: gitlab
    platform: GitLab
    profile: "https://gitlab.com/{handle}"
    link_hosts: [gitlab.com, www.gitlab.com]
    link_paths: ["/{handle}"]
    handle_chars: "-_."
    handle_min: 2
    handle_max: 255
    no_edge: "-_."
    reserved: [explore, help, users, dashboard, groups, projects, search, admin, api]
    presence: status
    exists: [200]
    absent: []
    examples: ["https://gitlab.com/example"]
    source: "https://gitlab.com/"
    verified: true
    note: "gitlab.com/gitlab-org answered 200; a random handle answered 302 to the sign-in page, as a private one would, so absence is never concluded (only existence)."
