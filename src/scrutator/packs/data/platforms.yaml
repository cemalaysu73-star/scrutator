    verified: true
    note: "hub.docker.com/u/docker answered 200 and a random handle 404 (2026-10-20). A /r/<namespace> link is read as the namespace."
  # --- not checked: the page does not tell (same status for any handle), blocks automated requests, sits behind a
  #     consent or login wall, or the platform's terms forbid automated access. A published link is reported as
  #     "unverifiable"; no request is made.
