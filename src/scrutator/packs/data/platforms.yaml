    handle_chars: "_"
    handle_min: 1
    handle_max: 15
    no_edge: ""
    reserved: [home, explore, search, i, intent, share, login, signup, settings, tos, privacy, hashtag]
    presence: unverifiable
    exists: []
    absent: []
    examples: ["https://twitter.com/example", "https://x.com/example_org"]
    source: "https://x.com/"
    verified: false
    note: "Not requested: X's terms forbid crawling without prior written consent. (A random handle answered 404 once on 2026-10-20; not relied on.)"
