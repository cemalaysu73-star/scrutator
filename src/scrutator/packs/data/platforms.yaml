    handle_max: 30
    no_edge: ""
    reserved: []
    presence: status
    exists: [200]
    absent: [404]
    examples: ["https://mastodon.social/@example"]
    source: "https://mastodon.social/"
    verified: true
    note: "Only the mastodon.social instance; other instances are other hosts and are not checked. mastodon.social/@Mastodon answered 200 and a random handle 404 (2026-10-20)."
