# Takeover fingerprints (spec section 13): services whose hostnames can be claimed by someone
# else when a CNAME that points at them dangles.
#
# Source: the community project can-i-take-over-xyz (https://github.com/EdOverflow/can-i-take-over-xyz),
# fingerprints.json read on 2026-10-16. An entry is listed here only if that file gives a CNAME
# pattern for the service and marks it "Vulnerable" (or "Edge case"). Services marked "Not vulnerable"
# are left out on purpose.
#
# dangling: nxdomain          the target name does not exist in DNS; a passive lookup can see it.
# dangling: http-fingerprint  the name resolves but the service shows an "unclaimed" page; that needs
#                             an active probe, which passive mode never makes. Passive mode reports
#                             such a service only when its target also fails to resolve.
schema: 1
kind: takeover
version: 2026.10.1
updated: 2026-10-16
description: Claimable-service fingerprints for dangling CNAME detection.
