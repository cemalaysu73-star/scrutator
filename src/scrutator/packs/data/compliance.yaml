# Informational compliance mapping: which control of a framework a risk rule's finding is relevant to.
#
# This is NOT a certification, an audit opinion or a legal conclusion. It tells a reader where in a framework the
# subject of a finding is discussed, so a consultant can file the evidence in the right place of an ISO/IEC 27001,
# NIS2 or KVKK/GDPR evidence folder. Whether a finding is evidence for or against a control is the auditor's call.
#
# `verified: true` on a mapping means: the referenced article, safeguard or test was read on the cited authoritative
# public page on 2026-10-21 and its subject matches the paraphrase in `title`. It does not mean the framework owner or
# any auditor agrees that the finding belongs there; that link is the author's judgement in every case.
# `verified: false` means the reference could not be read at an authoritative public source: ISO/IEC 27001:2022 is a
# paid standard and iso.org answered 403 to the pages that might list Annex A, so every ISO mapping is unverified and
# its control number and title are the author's, to be checked against a licensed copy of the standard.
# An entry is `verified: true` only when every one of its mappings is.
#
# Sources read on 2026-10-21:
#   NIS2  Directive (EU) 2022/2555, Official Journal text from the EU Publications Office (EUR-Lex returned empty pages):
#         https://publications.europa.eu/resource/cellar/9b84d482-85bd-11ed-9887-01aa75ed71a1.0006.03/DOC_1
#   CIS   CIS Critical Security Controls navigator, showing v8.1 (safeguard numbers as in v8):
#         https://www.cisecurity.org/controls/cis-controls-navigator
#   OWASP Web Security Testing Guide, WSTG-CONF-10 Subdomain Takeover, and the OWASP Top 10 2021 pages
#   KVKK  Law No. 6698, official text on mevzuat.gov.tr

